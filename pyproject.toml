[project]
name = "mlprep"
version = "1.0.0"
description = "Reproducible ML preprocessing CLI — profile datasets, apply configurable preprocessing pipelines, and export reusable scikit-learn pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ganesh" }]
keywords = ["machine-learning", "preprocessing", "cli", "scikit-learn", "pandas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
[tool.uv]
package = true

[project.scripts]
mlprep = "mlprep.cli:app"

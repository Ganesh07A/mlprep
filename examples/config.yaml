# MLPrep configuration example
#
# Run with:
#   mlprep preprocess data.csv --config config.yaml
#
# All fields are optional. Missing fields fall back to defaults.
#
# Security note:
#   Only load preprocessor.joblib files generated by trusted MLPrep runs.
#   Python pickle/joblib can execute arbitrary code if the file is tampered with.

missing_values:
  # Numerical missing-value strategy.
  # Supported: median (default), mean, constant
  numerical: median

  # Categorical missing-value strategy.
  # Supported: most_frequent (default), constant
  categorical: most_frequent

encoding:
  # Feature encoding for categorical columns.
  # Supported: onehot (default)
  method: onehot

scaling:
  # Feature scaling for numerical columns.
  # Supported: standard (default)
  method: standard
